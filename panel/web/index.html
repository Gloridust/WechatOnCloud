<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <!-- 手机浏览器顶栏 / 状态栏的颜色跟页面布底一致（深色另算），由下面的脚本和 theme.ts 跟着主题改 -->
    <meta name="theme-color" content="#edeff3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="云微" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>云微</title>
    <script>
      // 首屏前置好主题，避免亮/暗闪烁。auto/light/dark；缺省 auto（CSS 用 prefers-color-scheme 决定）。
      var t = 'auto';
      try {
        var s = localStorage.getItem('woc_theme');
        if (s === 'light' || s === 'dark') t = s;
      } catch (e) {}
      document.documentElement.dataset.theme = t;
      try {
        var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#121419' : '#edeff3');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
